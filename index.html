<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b5532f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NoutBook">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<title>NoutBook</title>
<style>
:root{
  --bg:#fbf6ee; --card:#fffdf9; --ink:#2e2520; --muted:#8a7b70; --line:#eadfce;
  --accent:#b5532f; --accent-ink:#fff; --accent-soft:#f6e3d8; --ok:#4f7a4a;
  --radius:16px; --shadow:0 2px 10px rgba(80,50,20,.08);
  --serif:Georgia,"Iowan Old Style","Palatino Linotype",serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#1d1814; --card:#272019; --ink:#f1e7da; --muted:#a69686; --line:#3a3027; --accent:#e0805a; --accent-ink:#1d1814; --accent-soft:#3b2a20; --shadow:0 2px 10px rgba(0,0,0,.4)}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
header.top{position:sticky;top:0;z-index:10;background:var(--bg);padding:calc(12px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
header.top h1{font-family:var(--serif);font-size:1.35rem;margin:0;flex:1;font-weight:700}
header.top h1 a{color:inherit;text-decoration:none}
.icon-btn{background:none;border:0;color:var(--ink);font-size:1.4rem;width:40px;height:40px;border-radius:50%;cursor:pointer}
.icon-btn:active{background:var(--accent-soft)}
main{max-width:900px;margin:0 auto;padding:14px 16px}
.search{width:100%;padding:12px 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:1rem}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 14px;border-radius:999px;font:inherit;font-size:.9rem;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:10px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);text-decoration:none;color:inherit;display:flex;flex-direction:column;position:relative}
.card .ph{aspect-ratio:4/3;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;font-size:2.4rem}
.card .ph img{width:100%;height:100%;object-fit:cover;display:block}
.card .body{padding:10px 12px 12px}
.card h3{font-family:var(--serif);font-size:1rem;margin:0 0 2px;line-height:1.25}
.card small{color:var(--muted)}
.card .star{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.45);color:#ffd36b;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-size:.95rem}
.empty{text-align:center;color:var(--muted);padding:56px 20px}
.empty .big{font-size:3rem}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:14px 22px;font:inherit;font-weight:600;font-size:1rem;box-shadow:0 6px 18px rgba(0,0,0,.25);cursor:pointer;text-decoration:none}
/* detail */
.gallery{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:var(--radius);margin-bottom:14px}
.gallery img{flex:none;width:100%;max-height:420px;object-fit:cover;scroll-snap-align:center;border-radius:var(--radius);cursor:zoom-in}
.gallery.multi img{width:88%}
h2.title{font-family:var(--serif);font-size:1.8rem;margin:4px 0 6px;line-height:1.2}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 16px}
.tag{background:var(--accent-soft);color:var(--accent);padding:4px 12px;border-radius:999px;font-size:.85rem}
section.block{background:var(--card);border-radius:var(--radius);padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow)}
section.block h3{font-family:var(--serif);margin:0 0 10px;font-size:1.2rem}
ul.ing{list-style:none;margin:0;padding:0}
ul.ing li{padding:8px 0;border-bottom:1px dashed var(--line);display:flex;gap:10px;cursor:pointer}
ul.ing li:last-child{border:0}
ul.ing li::before{content:"○";color:var(--accent)}
ul.ing li.done{color:var(--muted);text-decoration:line-through}
ul.ing li.done::before{content:"●"}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:s}
ol.steps li{counter-increment:s;display:flex;gap:12px;padding:8px 0}
ol.steps li::before{content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.9rem;margin-top:1px}
.notes{white-space:pre-wrap}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
[hidden]{display:none !important}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 16px;border-radius:12px;font:inherit;cursor:pointer;text-decoration:none;display:inline-block}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.danger{color:#c0392b}
/* form */
form label{display:block;font-weight:600;margin:16px 0 6px;font-size:.95rem}
form label small{font-weight:400;color:var(--muted)}
form input[type=text],form input[type=number],form select,form textarea{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:1rem}
form textarea{min-height:130px;resize:vertical}
.row{display:flex;gap:12px}.row>div{flex:1}
.thumbs{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.thumb{position:relative;width:92px;height:92px;border-radius:12px;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb button{position:absolute;top:4px;right:4px;border:0;background:rgba(0,0,0,.6);color:#fff;border-radius:50%;width:24px;height:24px;cursor:pointer}
.thumb.cover::after{content:"Couverture";position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);color:#fff;font-size:.65rem;text-align:center;padding:2px}
.addphoto{width:92px;height:92px;border-radius:12px;border:2px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);cursor:pointer;font-size:.75rem;gap:2px}
.addphoto b{font-size:1.6rem;color:var(--accent);line-height:1}
.formbar{display:flex;gap:10px;margin-top:24px}
.formbar .btn{flex:1;text-align:center}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;z-index:50}
.lightbox img{max-width:96vw;max-height:92vh;border-radius:8px}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;z-index:60;font-size:.9rem;display:flex;align-items:center;gap:14px;max-width:92vw;white-space:nowrap}
.toast span{overflow:hidden;text-overflow:ellipsis}
.toast button{background:none;border:0;color:#ffd36b;font:inherit;font-weight:700;cursor:pointer;padding:0}
dialog{border:0;border-radius:var(--radius);background:var(--card);color:var(--ink);padding:20px;max-width:420px;width:calc(100% - 32px);box-shadow:0 10px 40px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog h3{font-family:var(--serif);margin:0 0 8px}
dialog p{color:var(--muted);margin:0 0 14px}
dialog .col{display:flex;flex-direction:column;gap:10px}
.icon-btn{position:relative}
.badge{position:absolute;top:1px;right:-1px;background:var(--accent);color:var(--accent-ink);font-size:.65rem;font-weight:700;border-radius:999px;min-width:17px;height:17px;line-height:17px;text-align:center;padding:0 4px}
.muted{color:var(--muted)}
.hint{color:var(--muted);font-size:.85rem;margin:0 0 10px}
ul.pick,ul.shop{list-style:none;margin:0;padding:0}
ul.pick li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
ul.pick li:last-child,ul.shop li:last-child{border:0}
.step{display:flex;align-items:center;gap:6px;flex:none}
.step button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:1.1rem;cursor:pointer;padding:0}
.step b{min-width:22px;text-align:center}
.step small{color:var(--muted)}
ul.shop li{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px dashed var(--line);cursor:pointer}
ul.shop .cb{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--accent)}
ul.shop li.done .cb{background:var(--accent);box-shadow:inset 0 0 0 4px var(--card)}
ul.shop .it{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px}
ul.shop .nm{font-weight:600}
ul.shop .qt{color:var(--accent)}
ul.shop .fr{flex-basis:100%;color:var(--muted);font-size:.78rem}
ul.shop li.done .it{opacity:.5;text-decoration:line-through}
ul.shop .x{border:0;background:none;color:var(--muted);font-size:1.1rem;cursor:pointer;width:32px;height:32px;flex:none}
.addrow{display:flex;gap:8px;margin-top:14px}
.addrow input{flex:1;min-width:0;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:1rem}
.card .cl{display:flex;flex-direction:column;color:inherit;text-decoration:none;flex:1}
.card .body{padding-right:52px}
.cardcart{position:absolute;right:8px;bottom:8px;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:1rem;cursor:pointer;box-shadow:var(--shadow);padding:0}
.cardcart.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
ul.pick .pt{flex:1;min-width:0;color:inherit;text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
ul.pick .x{border:0;background:none;color:var(--muted);font-size:1.1rem;cursor:pointer;width:32px;height:32px;flex:none;padding:0}
.dot{position:absolute;top:6px;right:5px;width:11px;height:11px;border-radius:50%;border:2px solid var(--bg);background:var(--muted)}
.dot.green{background:#3f9d55}.dot.orange{background:#e0a030}.dot.red{background:#d64545}
dialog{max-height:88vh;overflow:auto}
.syncbox{margin-bottom:18px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.syncbox .hint{margin:0 0 10px}
.syncbox input{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:1rem;margin-bottom:8px}
.autherr{color:#c0392b;font-size:.85rem;min-height:1.2em;margin:0 0 6px}
.row2{display:flex;gap:8px}.row2 .btn{flex:1;text-align:center}
:root{--buy:#e0555d;--cat:#4f8f85}
@media (prefers-color-scheme:dark){:root{--buy:#c94a52;--cat:#3f7a71}}
.tsec h3{font-family:var(--serif);font-size:1.15rem;margin:18px 0 10px;display:flex;align-items:center;gap:8px}
.tsec:first-of-type h3{margin-top:6px}
.cnt{background:var(--buy);color:#fff;border-radius:999px;font-size:.75rem;padding:1px 10px;font-family:var(--sans);font-weight:700}
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(min-width:560px){.tgrid{grid-template-columns:repeat(4,1fr)}}
@media(min-width:760px){.tgrid{grid-template-columns:repeat(5,1fr)}}
.tile{position:relative;aspect-ratio:1/1;border:0;border-radius:14px;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:6px 4px;font:inherit;cursor:pointer;box-shadow:var(--shadow);-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.tile:active{transform:scale(.96)}
.tile.buy{background:var(--buy)}
.tile.cat{background:var(--cat)}
.tile.add{background:transparent;border:2px dashed var(--cat);color:var(--ink);box-shadow:none}
.tile .te{font-size:2.1rem;line-height:1}
.tile .tn{font-weight:600;font-size:.82rem;line-height:1.15;text-align:center;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word;max-width:100%}
.tile .tq{font-size:.74rem;opacity:.95;font-weight:600}
.tile .tb{position:absolute;top:5px;left:5px;font-size:.58rem;background:rgba(0,0,0,.3);padding:1px 6px;border-radius:999px}
.hint.box{background:var(--card);border-radius:12px;padding:14px;text-align:center;margin:0}
.searchbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -4px 14px rgba(0,0,0,.12)}
.searchbar form{max-width:900px;margin:0 auto;display:flex;gap:10px;align-items:center}
.sbox{flex:1;display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:0 14px;margin:0}
.sbox input{flex:1;min-width:0;border:0;background:none;color:var(--ink);font:inherit;font-size:1rem;padding:12px 0;outline:none}
.sbtn{width:46px;height:46px;border-radius:50%;border:0;background:var(--cat);color:#fff;font-size:1.6rem;line-height:1;cursor:pointer;flex:none;padding:0}
@media print{.searchbar{display:none}}
@media print{header.top,.fab,.actions{display:none}body{background:#fff;color:#000}section.block{box-shadow:none;border:1px solid #ccc}}
</style>
</head>
<body>
<header class="top">
  <button class="icon-btn" id="back" hidden aria-label="Retour">←</button>
  <h1><a href="#/">NoutBook</a></h1>
  <button class="icon-btn" id="cartbtn" aria-label="Liste de courses">🛒<span class="badge" id="badge" hidden></span></button>
  <button class="icon-btn" id="menu" aria-label="Synchronisation et sauvegarde">⋯<span class="dot" id="dot" hidden></span></button>
</header>
<main id="view"></main>
<a class="fab" id="fab" href="#/new">＋ Nouvelle recette</a>

<dialog id="pdfdlg">
  <h3>PDF prêt</h3>
  <p id="pdfname"></p>
  <div class="col">
    <button class="btn primary" type="button" id="pdfshare" hidden>Partager…</button>
    <a class="btn" id="pdfdl" style="text-align:center">Télécharger / ouvrir le PDF</a>
    <button class="btn" type="button" id="pdfclose">Fermer</button>
  </div>
</dialog>

<dialog id="tiledlg">
  <h3 id="tdt"></h3>
  <p>Options pour ce produit.</p>
  <div class="col">
    <button class="btn" type="button" id="tdskip" hidden>Retirer sans compter comme un achat (déjà à la maison)</button>
    <button class="btn" type="button" id="tdbasic"></button>
    <button class="btn" type="button" id="tdclose">Fermer</button>
  </div>
</dialog>

<dialog id="dlg">
  <h3>Synchronisation</h3>
  <div class="syncbox">
    <p class="hint" id="syncmsg" aria-live="polite"></p>
    <form id="authf" hidden>
      <input type="email" id="aemail" placeholder="E-mail du compte partagé" autocomplete="username" required>
      <input type="password" id="apass" placeholder="Mot de passe (6 caractères min.)" autocomplete="current-password" minlength="6" required>
      <p class="autherr" id="autherr" role="alert"></p>
      <button class="btn primary" type="submit" style="width:100%">Se connecter</button>
    </form>
    <button class="btn" type="button" id="signout" hidden>Se déconnecter</button>
  </div>
  <h3>Sauvegarde</h3>
  <p>Copie de secours dans un fichier (photos comprises), à garder ou à importer sur un autre téléphone.</p>
  <div class="col">
    <button class="btn primary" id="exp">⬇ Exporter mes recettes</button>
    <label class="btn" style="text-align:center;margin:0">⬆ Importer une sauvegarde<input type="file" id="imp" accept=".json,application/json" hidden></label>
    <button class="btn" id="dlgclose">Fermer</button>
  </div>
</dialog>

<script>
"use strict";
const CATS=["Entrée","Plat","Dessert","Gâteau & pâtisserie","Boisson","Autre"];
const EMOJI={"Entrée":"🥗","Plat":"🍲","Dessert":"🍮","Gâteau & pâtisserie":"🎂","Boisson":"🍹","Autre":"🍴"};

/* ---------- IndexedDB ---------- */
let dbp;
function db(){
  return dbp||(dbp=new Promise((res,rej)=>{
    const r=indexedDB.open("livre-recettes",1);
    r.onupgradeneeded=()=>r.result.createObjectStore("recipes",{keyPath:"id"});
    r.onsuccess=()=>res(r.result);
    r.onerror=()=>rej(r.error);
  }));
}
async function tx(mode,fn){
  const d=await db();
  return new Promise((res,rej)=>{
    const t=d.transaction("recipes",mode);
    const out=fn(t.objectStore("recipes"));
    t.oncomplete=()=>res(out&&out.result!==undefined?out.result:undefined);
    t.onerror=()=>rej(t.error);
  });
}
const allRecipes=()=>tx("readonly",s=>s.getAll());
const getRecipe=id=>tx("readonly",s=>s.get(id));
const putRecipeLocal=r=>tx("readwrite",s=>s.put(r));
const delRecipeLocal=id=>tx("readwrite",s=>s.delete(id));
const syncHooks={push:null,remove:null,pushShop:null};
async function putRecipe(r){
  await putRecipeLocal(r);
  if(syncHooks.push)syncHooks.push(r);
}
async function delRecipe(id){
  await delRecipeLocal(id);
  if(syncHooks.remove)syncHooks.remove(id);
  if(shop.sel[id]){removeRecipeFromCart(shop,id);saveShop();updateBadge()}
}

/* ---------- utils ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const lines=t=>String(t||"").split("\n").map(l=>l.trim()).filter(Boolean);
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
function resizeImage(file,max=1024,q=.75){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file),img=new Image();
    img.onload=()=>{
      const k=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement("canvas");
      c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL("image/jpeg",q));
    };
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("Image illisible"))};
    img.src=url;
  });
}
function norm(s){return String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")}

/* ---------- state ---------- */
let filter={q:"",cat:"all"};

/* ---------- views ---------- */
const view=$("#view");
function chrome(isHome){
  $("#back").hidden=isHome;
  $("#fab").hidden=!isHome;
  updateBadge();
}
function updateBadge(){
  const n=Object.keys(shop.sel).length,b=$("#badge");
  b.hidden=!n;b.textContent=n;
}

async function viewList(){
  chrome(true);
  const rs=(await allRecipes()).sort((a,b)=>b.updated-a.updated);
  view.innerHTML=`
    <input class="search" id="q" type="search" placeholder="Rechercher une recette, un ingrédient…" value="${esc(filter.q)}">
    <div class="chips" id="chips"></div>
    <div id="results"></div>`;
  const chips=[["all","Toutes"],["fav","★ Favoris"],...CATS.map(c=>[c,c])];
  $("#chips").innerHTML=chips.map(([k,l])=>`<button class="chip ${filter.cat===k?"on":""}" data-k="${esc(k)}">${esc(l)}</button>`).join("");
  $("#chips").onclick=e=>{const b=e.target.closest(".chip");if(!b)return;filter.cat=b.dataset.k;viewList()};
  const draw=()=>{
    const q=norm(filter.q);
    const list=rs.filter(r=>{
      if(filter.cat==="fav"&&!r.fav)return false;
      if(filter.cat!=="all"&&filter.cat!=="fav"&&r.category!==filter.cat)return false;
      if(!q)return true;
      return norm([r.title,r.ingredients,r.steps,r.notes,r.category].join(" ")).includes(q);
    });
    if(!rs.length){
      $("#results").innerHTML=`<div class="empty"><div class="big">🍳</div><p><b>Ton livre est vide pour l’instant.</b><br>Ajoute ta première recette avec le bouton ci-dessous.</p></div>`;return;
    }
    if(!list.length){$("#results").innerHTML=`<div class="empty"><div class="big">🔍</div><p>Aucune recette ne correspond.</p></div>`;return}
    $("#results").innerHTML=`<div class="grid">${list.map(r=>`
      <div class="card">
        <a class="cl" href="#/r/${r.id}">

const nrm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
const stripAcc=s=>nrm(s).replace(/œ/g,"oe").replace(/[’]/g,"'");
const escRe=s=>s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
const FRACS={"½":.5,"¼":.25,"¾":.75,"⅓":1/3,"⅔":2/3};
const UNIT_DEFS=[
  {fam:"mass",f:1,u:"g",al:["g","gr","gramme"]},
  {fam:"mass",f:1000,u:"kg",al:["kg","kilo"]},
  {fam:"vol",f:1,u:"ml",al:["ml","millilitre"]},
  {fam:"vol",f:10,u:"cl",al:["cl","centilitre"]},
  {fam:"vol",f:100,u:"dl",al:["dl","decilitre"]},
  {fam:"vol",f:1000,u:"l",al:["l","litre"]},
  {fam:"cas",f:1,u:"c. à soupe",al:["cuillere a soupe","c. a soupe","c a soupe","c.a.s","cas","cs"]},
  {fam:"cac",f:1,u:"c. à café",al:["cuillere a cafe","c. a cafe","c a cafe","c.a.c","cac","cc"]}
];
const DISCRETE=["pincée","sachet","boîte","gousse","tranche","verre","brin","botte","bûche","pot","paquet","morceau","feuille","brique","barquette","tablette","tasse","bol","poignée","branche","rondelle","filet"];

function parseNumber(s){
  s=s.replace(/^\s+/,"");
  let m;
  if((m=s.match(/^(\d+)\s+(\d+)\/(\d+)\s*/)))return{n:+m[1]+m[2]/m[3],rest:s.slice(m[0].length)};
  if((m=s.match(/^(\d+)\/(\d+)\s*/)))return{n:m[1]/m[2],rest:s.slice(m[0].length)};
  if((m=s.match(/^(\d+)\s*(?:-|–|à)\s*(\d+)\s*/)))return{n:+m[2],rest:s.slice(m[0].length)};
  m=s.match(/^(\d+(?:[.,]\d+)?)?\s*([½¼¾⅓⅔])?\s*/);
  if(m&&(m[1]||m[2])){
    return{n:(m[1]?parseFloat(m[1].replace(",",".")):0)+(m[2]?FRACS[m[2]]:0),rest:s.slice(m[0].length)};
  }
  return null;
}
function matchUnit(nr,alias){
  const m=nr.match(new RegExp("^"+escRe(alias)+"(?:s|x)?(?=[\\s.,;)]|$)"));
  return m?m[0].length:0;
}
function parseIngredient(line){
  const t=String(line||"").replace(/^[\-•*·]\s*/,"").trim();
  if(!t)return null;
  const pn=parseNumber(t);
  let n=null,rest=t,fam="n",f=1,u="";
  if(pn){n=pn.n;rest=pn.rest.trim()}
  if(n!==null&&rest){
    const nr=nrm(rest);
    let hit=null;
    for(const d of UNIT_DEFS)for(const a of d.al){
      const len=matchUnit(nr,a);
      if(len&&(!hit||len>hit.len))hit={len,fam:d.fam,f:d.f,u:d.u};
    }
    if(!hit)for(const d of DISCRETE){
      const len=matchUnit(nr,nrm(d));
      if(len&&(!hit||len>hit.len))hit={len,fam:"u:"+nrm(d),f:1,u:d};
    }
    if(hit){
      let after=rest.slice(hit.len).replace(/^[.\s]+/,"");
      const dm=nrm(after).match(/^(de la |de l['’]|du |des |de |d['’])/);
      if(dm)after=after.slice(dm[0].length);
      after=after.trim();
      if(after){rest=after;fam=hit.fam;f=hit.f;u=hit.u}
    }
  }
  const name=rest.replace(/[.\s]+$/,"").trim();
  if(!name)return null;
  return{v:n===null?null:n*f,fam,u,name};
}
// clé sûre (utilisable comme nom de champ Firestore) : uniquement a-z, 0-9, apostrophe, espace, "_"
const fk=k=>String(k).replace(/[^a-z0-9' ]/gu,c=>"_"+c.codePointAt(0).toString(16)).trim()||"x";
function nameKey(name){
  let s=stripAcc(name).split(",")[0].replace(/\([^)]*\)/g,"").replace(/[^a-z0-9' ]/g," ");
  s=s.split(/\s+/).filter(Boolean).map(w=>w.length>3&&/[sx]$/.test(w)?w.slice(0,-1):w).join(" ");
  return s||fk(stripAcc(name));
}
function fmtNum(v){return String(Math.round(v*100)/100).replace(".",",")}
function fmtQty(fam,v,u){
  if(fam==="mass")return v>=1000?fmtNum(v/1000)+" kg":fmtNum(v)+" g";
  if(fam==="vol"){
    if(v>=1000)return fmtNum(v/1000)+" l";
    return v%10===0?fmtNum(v/10)+" cl":fmtNum(v)+" ml";
  }
  if(fam==="n")return fmtNum(v);
  return fmtNum(v)+" "+(fam.startsWith("u:")&&v>=2?u+"s":u);
}
function fmtQtyAll(q){
  const order=["mass","vol","cas","cac"];
  const fams=Object.keys(q).sort((a,b)=>{
    const ia=order.indexOf(a),ib=order.indexOf(b);
    const ra=a==="n"?99:ia<0?50:ia,rb=b==="n"?99:ib<0?50:ib;
    return ra-rb;
  });
  return fams.map(k=>fmtQty(k,q[k].v,q[k].u)).join(" + ");
}
const capFirst=s=>s.charAt(0).toUpperCase()+s.slice(1);
function buildList(recipes,sel){
  const map=new Map();
  for(const r of recipes){
    const base=Number(r.servings)||1,want=Number(sel[r.id])||base,factor=want/base;
    for(const line of String(r.ingredients||"").split("\n")){
      const p=parseIngredient(line);
      if(!p)continue;
      const key=nameKey(p.name);
      const e=map.get(key)||{key,name:capFirst(p.name),qty:{},from:new Set()};
      if(p.v!==null){
        const q=e.qty[p.fam]||(e.qty[p.fam]={v:0,u:p.u});
        q.v+=p.v*factor;
      }
      e.from.add(r.title);
      map.set(key,e);
    }
  }
  return [...map.values()]
    .map(e=>({key:e.key,name:e.name,qty:fmtQtyAll(e.qty),from:[...e.from]}))
    .sort((a,b)=>a.name.localeCompare(b.name,"fr",{sensitivity:"base"}));
}

const BUILTIN_PRODUCTS=["Lait","Pain","Œufs","Beurre","Crème fraîche","Yaourts","Fromage râpé","Fromage","Jambon","Lardons","Poulet","Steak haché","Saucisses","Poisson","Saumon","Crevettes","Riz","Pâtes","Semoule","Farine","Sucre","Sel","Poivre","Huile d'olive","Vinaigre","Moutarde","Ketchup","Mayonnaise","Café","Thé","Eau","Jus d'orange","Soda","Vin","Bière","Pommes","Bananes","Oranges","Citrons","Fraises","Raisin","Tomates","Carottes","Oignons","Ail","Pommes de terre","Salade","Courgettes","Poivrons","Concombre","Champignons","Brocoli","Avocat","Chocolat","Biscuits","Céréales","Confiture","Miel","Compote","Glace","Chips","Papier toilette","Essuie-tout","Liquide vaisselle","Lessive","Savon","Dentifrice","Shampooing","Sacs poubelle","Éponges","Piles","Ampoules"];
const EMOJI_MAP=[["oeuf","🥚"],["lait","🥛"],["beurre","🧈","🧀"],["fromage","🧀"],["chevre","🧀"],["gruyere","🧀"],["mozzarella","🧀"],["parmesan","🧀"],["comte","🧀"],["creme","🥛"],["yaourt","🥛"],["baguette","🥖"],["pain","🍞"],["pate brisee","🥧"],["pate feuilletee","🥧"],["pate a","🥧"],["pate sablee","🥧"],["farine","🌾"],["semoule","🌾"],["sucre","🍬"],["sel","🧂"],["poivre","🧂"],["huile","🫒","🍶"],["olive","🫒","🥗"],["vinaigre","🍶"],["moutarde","🥫"],["ketchup","🥫"],["de terre","🥔"],["patate","🥔"],["tomate","🍅"],["pomme","🍎"],["poire","🍐"],["banane","🍌"],["orange","🍊"],["citron","🍋"],["fraise","🍓"],["framboise","🍓"],["raisin","🍇"],["peche","🍑"],["abricot","🍑"],["cerise","🍒"],["ananas","🍍"],["melon","🍈"],["pasteque","🍉"],["kiwi","🥝"],["avocat","🥑"],["carotte","🥕"],["oignon","🧅","🥗"],["echalote","🧅","🥗"],["poulet","🍗"],["dinde","🍗"],["ail","🧄","🥗"],["aubergine","🍆"],["courgette","🥒"],["concombre","🥒"],["poivron","🫑","🌶️"],["piment","🌶️"],["salade","🥬","🥗"],["epinard","🥬","🥗"],["chou","🥬","🥗"],["brocoli","🥦"],["champignon","🍄"],["mais","🌽"],["haricot","🫘","🌱"],["lentille","🫘","🌱"],["pois","🫘","🌱"],["boeuf","🥩"],["viande","🥩"],["steak","🥩"],["porc","🥩"],["jambon","🥓"],["lardon","🥓"],["bacon","🥓"],["saucisse","🌭"],["poisson","🐟"],["saumon","🐟"],["thon","🐟"],["crevette","🦐"],["riz","🍚"],["spaghetti","🍝"],["pate","🍝"],["nouille","🍜"],["chocolat","🍫"],["biscuit","🍪"],["cereale","🥣"],["cafe","☕"],["the","🍵"],["eau","💧"],["jus","🧃","🥤"],["soda","🥤"],["vin","🍷"],["biere","🍺"],["miel","🍯"],["confiture","🍯"],["compote","🍎"],["noix","🥜"],["amande","🥜"],["noisette","🥜"],["cacahuete","🥜"],["glace","🍨"],["chips","🥔"],["levure","🧁"],["vanille","🍦"],["menthe","🌿"],["basilic","🌿"],["persil","🌿"],["thym","🌿"],["herbe","🌿"],["papier","🧻"],["essuie","🧻"],["lessive","🧴"],["vaisselle","🧴"],["shampooing","🧴"],["savon","🧼"],["dentifrice","🪥","🧼"],["poubelle","🗑️"],["eponge","🧽"],["pile","🔋"],["ampoule","💡"]].map(([k,e,f])=>[new RegExp("(?:^| )"+k+"[a-z]{0,2}(?= |$)"),f?[e,f]:[e]]);
// émojis possibles pour un produit (le 1er, puis un plus ancien si l'appareil ne sait pas afficher le 1er)
function emojiCandidates(name){
  const s=stripAcc(name).replace(/[^a-z0-9' ]/g," ").replace(/\s+/g," ").trim();
  for(const [re,list] of EMOJI_MAP)if(re.test(s))return list;
  return["🛒"];
}
const emojiFor=name=>emojiCandidates(name)[0];
function normalizeShop(s){
  const o=Object.assign({sel:{},have:{},extra:[],freq:{},basics:{}},s||{});
  const obj=v=>v&&typeof v==="object"&&!Array.isArray(v);
  if(!obj(o.sel))o.sel={};
  if(!obj(o.have))o.have={};
  if(!obj(o.freq))o.freq={};
  if(!obj(o.basics))o.basics={};
  if(!Array.isArray(o.extra))o.extra=[];
  // ancien format : article ajouté à la main puis « coché » (clé x:…) = déjà pris → on l'enlève de la liste
  const keep=[];
  for(const t of o.extra){
    if(typeof t!=="string"||!t.trim())continue;
    const old="x:"+nrm(t);
    if(o.have[old]){delete o.have[old];continue}
    keep.push(t);
  }
  o.extra=keep;
  for(const k of Object.keys(o.have))if(k.startsWith("x:"))delete o.have[k];
  return o;
}
function mergeFreq(a,b){
  const out={};
  for(const src of [a||{},b||{}])for(const [k,v] of Object.entries(src)){
    if(!v||typeof v!=="object")continue;
    const cur=out[k];
    if(!cur||(Number(v.n)||0)>(Number(cur.n)||0)||((Number(v.n)||0)===(Number(cur.n)||0)&&(Number(v.last)||0)>(Number(cur.last)||0)))out[k]={n:Number(v.n)||0,last:Number(v.last)||0,name:v.name||(cur&&cur.name)||""};
  }
  return out;
}
// La liste « à acheter » : ingrédients des recettes choisies (hors déjà pris et hors produits de base) + articles ajoutés
function shopList(selected,shop){
  const out=[],seen=new Set();
  for(const it of buildList(selected,shop.sel)){
    if(shop.have[it.key]||isBasic(shop,it.key))continue;
    out.push({key:it.key,name:it.name,qty:it.qty,from:it.from,kind:"recipe"});seen.add(it.key);
  }
  for(const t of shop.extra){
    const k=nameKey(t);
    if(seen.has(k))continue;
    seen.add(k);
    out.push({key:k,name:t,qty:"",from:[],kind:"extra"});
  }
  return out.sort((a,b)=>a.name.localeCompare(b.name,"fr",{sensitivity:"base"}));
}
function bumpFreq(shop,key,name){
  const e=shop.freq[key]||{n:0,last:0,name:name};
  e.n=(Number(e.n)||0)+1;e.last=Date.now();if(!e.name)e.name=name;
  shop.freq[key]=e;
}
// Toucher une tuile rouge = acheté (compte pour la fréquence) ; count=false = déjà à la maison
function buyItem(shop,item,count=true){
  if(item.kind==="recipe")shop.have[item.key]=true;
  shop.extra=shop.extra.filter(t=>nameKey(t)!==item.key);
  if(count)bumpFreq(shop,item.key,item.name);
}
// Toucher une tuile du catalogue = l'ajouter à la liste
function addToList(shop,name,derivedKeys){
  const key=nameKey(name);
  if(derivedKeys.has(key)&&!isBasic(shop,key)&&shop.have[key]){delete shop.have[key];return"recipe"}
  if(!shop.extra.some(t=>nameKey(t)===key))shop.extra.push(capFirst(String(name).trim()));
  return"extra";
}
function toggleBasic(shop,key){shop.basics[key]=!isBasic(shop,key)}
// Nouvelle série de courses : si le panier était vide, on oublie ce qui avait été « pris » la fois d'avant
function addRecipeToCart(shop,id,servings){
  if(!Object.keys(shop.sel).length)shop.have={};
  shop.sel[id]=servings;
}
function removeRecipeFromCart(shop,id){
  delete shop.sel[id];
  if(!Object.keys(shop.sel).length)shop.have={};
}
function buildCatalog(recipes,shop,onList,query){
  const m=new Map();
  const get=(key,name)=>{
    let e=m.get(key);
    if(!e){e={key,name,n:0,last:0,from:[],recipe:false,basic:isBasic(shop,key)};m.set(key,e)}
    return e;
  };
  for(const r of recipes)for(const line of String(r.ingredients||"").split("\n")){
    const p=parseIngredient(line);if(!p)continue;
    const e=get(nameKey(p.name),capFirst(p.name));
    e.recipe=true;if(!e.from.includes(r.title))e.from.push(r.title);
  }
  for(const [k,f] of Object.entries(shop.freq||{})){
    if(!f||typeof f!=="object")continue;
    const e=get(k,f.name||capFirst(k));
    e.n=Number(f.n)||0;e.last=Number(f.last)||0;if(f.name)e.name=f.name;
  }
  const q=stripAcc(query||"").replace(/[^a-z0-9' ]/g," ").replace(/\s+/g," ").trim();
  if(q)for(const n of BUILTIN_PRODUCTS)get(nameKey(n),n);
  const byFreq=(a,b)=>b.n-a.n||b.last-a.last||a.name.localeCompare(b.name,"fr",{sensitivity:"base"});
  let list=[...m.values()].filter(e=>!onList.has(e.key));
  if(q){
    const qk=nameKey(query);
    const exists=m.has(qk)||onList.has(qk);
    list=list.filter(e=>stripAcc(e.name).includes(q)).sort((a,b)=>{
      const pa=stripAcc(a.name).startsWith(q)?0:1,pb=stripAcc(b.name).startsWith(q)?0:1;
      return pa-pb||byFreq(a,b);
    });
    return{results:list,exists};
  }
  const top=list.filter(e=>e.n>0).sort(byFreq).slice(0,15);
  const topKeys=new Set(top.map(e=>e.key));
  const rest=list.filter(e=>!topKeys.has(e.key)).sort((a,b)=>a.name.localeCompare(b.name,"fr",{sensitivity:"base"}));
  return{top,rest};
}

/* ---------- émojis : repli si l'appareil ne sait pas afficher un émoji récent (carré vide) ---------- */
const _emojiOk=new Map();
function emojiOk(e){
  if(_emojiOk.has(e))return _emojiOk.get(e);
  let ok=true;
  try{
    const c=document.createElement("canvas");c.width=c.height=32;
    const g=c.getContext("2d",{willReadFrequently:true});
    const draw=t=>{g.clearRect(0,0,32,32);g.font="24px sans-serif";g.textBaseline="top";g.fillText(t,2,2);return g.getImageData(0,0,32,32).data};
    const ref=draw("\u{FFFFD}"),cur=draw(e);
    let same=true,any=false;
    for(let i=0;i<cur.length;i++){if(ref[i]!==cur[i])same=false;if(i%4===3&&cur[i])any=true}
    ok=any&&!same;
  }catch(err){ok=true}
  _emojiOk.set(e,ok);
  return ok;
}
function shownEmoji(name){
  for(const e of emojiCandidates(name))if(emojiOk(e))return e;
  return"🛒";
}

/* ---------- PDF d'une recette (fait sur l'appareil, fonctionne hors ligne) ---------- */
let pdfLibP=null,pdfUrl=null;
function loadPdfLib(){
  if(window.PDFLib)return Promise.resolve(window.PDFLib);
  return pdfLibP||(pdfLibP=new Promise((res,rej)=>{
    const s=document.createElement("script");
    s.src="vendor/pdf-lib.min.js";
    s.onload=()=>window.PDFLib?res(window.PDFLib):rej(new Error("bibliothèque PDF vide"));
    s.onerror=()=>{pdfLibP=null;rej(new Error("bibliothèque PDF introuvable"))};
    document.head.appendChild(s);
  }));
}
async function makeRecipePdf(r){
  const [PDFLib,mod]=await Promise.all([loadPdfLib(),import("./recipe-pdf.js")]);
  const bytes=await mod.buildRecipePdf(PDFLib,r);
  return new File([bytes],mod.pdfFileName(r.title),{type:"application/pdf"});
}
async function shareRecipePdf(r){
  const btn=$("#pdf");
  if(btn){btn.disabled=true;btn.textContent="Création du PDF…"}
  let file=null;
  try{file=await makeRecipePdf(r)}
  catch(e){toast("Impossible de créer le PDF")}
  if(btn){btn.disabled=false;btn.textContent="📄 Partager en PDF"}
  if(!file)return;
  // iPhone / Android : feuille de partage (Messages, WhatsApp, Mail, Fichiers…)
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title:r.title});return}
    catch(e){if(e&&e.name==="AbortError")return}   // annulé par l'utilisateur
  }
  openPdfDialog(file);   // ordinateur, ou partage refusé par le navigateur : menu de secours
}
function openPdfDialog(file){
  if(pdfUrl)URL.revokeObjectURL(pdfUrl);
  pdfUrl=URL.createObjectURL(file);
  const dl=$("#pdfdl");dl.href=pdfUrl;dl.download=file.name;
  $("#pdfname").textContent=file.name;
  const sh=$("#pdfshare");
  sh.hidden=!(navigator.canShare&&navigator.canShare({files:[file]}));
  sh.onclick=async()=>{
    try{await navigator.share({files:[file],title:file.name.replace(/\.pdf$/i,"")});$("#pdfdlg").close()}catch(e){}
  };
  $("#pdfclose").onclick=()=>$("#pdfdlg").close();
  $("#pdfdlg").showModal();
}

function toastUndo(msg,fn){
  document.querySelectorAll(".toast").forEach(t=>t.remove());
  const t=document.createElement("div");t.className="toast";
  const s=document.createElement("span");s.textContent=msg;
  const b=document.createElement("button");b.type="button";b.textContent="Annuler";
  b.onclick=()=>{t.remove();fn()};
  t.append(s,b);document.body.appendChild(t);
  setTimeout(()=>t.remove(),4500);
}
async function copyText(t){
  try{await navigator.clipboard.writeText(t);return true}catch(e){}
  try{
    const ta=document.createElement("textarea");
    ta.value=t;ta.style.cssText="position:fixed;opacity:0";
    document.body.appendChild(ta);ta.select();
    const ok=document.execCommand("copy");ta.remove();return ok;
  }catch(e){return false}
}

async function viewCourses(){

  updateBadge();
  view.innerHTML=`<div id="cw"></div>

    const selected=rs.filter(r=>shop.sel[r.id]);

    </button>`;
  const restore=snap=>{shop=normalizeShop(JSON.parse(snap));saveShop();updateBadge();draw()};

  const drawCat=()=>{
    const box=$("#cat");if(!box)return;
    const q=sq.value.trim();
    const c=buildCatalog(rs,shop,cur.keys,q);
    if(q){
      const addTile=c.exists?"":`<button type="button" class="tile add" data-add="${esc(q)}"><span class="te">＋</span><span class="tn">Ajouter « ${esc(q)} »</span></button>`;
      box.innerHTML=`<section class="tsec"><h3>Résultats</h3>
        <div class="tgrid">${addTile}${c.results.map(e=>tile("cat",e)).join("")}</div>
        ${!c.results.length&&c.exists?'<p class="hint">Ce produit est déjà dans ta liste.</p>':""}</section>`;
      return;
    }
    box.innerHTML=`<section class="tsec"><h3>Souvent achetés</h3>${
      c.top.length?`<div class="tgrid">${c.top.map(e=>tile("cat",e)).join("")}</div>`
      :`<p class="hint box">Les produits que tu achètes le plus remonteront ici, en tête. Touche une tuile rouge quand tu l’as mise dans ton chariot : elle compte comme un achat.</p>`}</section>`+
      (c.rest.length?`<section class="tsec"><h3>Dans vos recettes</h3><div class="tgrid">${c.rest.map(e=>tile("cat",e)).join("")}</div></section>`:"");
  };

  const draw=()=>{
    const y=window.scrollY;
    compute();
    const {selected,items}=cur;
    cw.innerHTML=`
      <h2 class="title">Liste de courses</h2>
      <section class="tsec">
        <h3>À acheter <span class="cnt">${items.length}</span></h3>
        ${items.length?`<div class="tgrid">${items.map(i=>tile("buy",i)).join("")}</div>
          <p class="hint">Touche une tuile quand c’est dans ton chariot. Appui long : options.</p>`
          :`<p class="hint box">${selected.length?"Tout est dans le chariot 🎉":"Ta liste est vide. Touche un produit ci-dessous, cherche-le avec « Il me faut… », ou ajoute une recette depuis l’accueil."}</p>`}
        <div class="actions" style="margin-top:10px">
          <button class="btn primary" type="button" id="copy" ${items.length?"":"disabled"}>📋 Copier la liste</button>
          ${navigator.share?`<button class="btn" type="button" id="share" ${items.length?"":"disabled"}>↗ Partager</button>`:""}
          <button class="btn danger" type="button" id="clear" ${selected.length||shop.extra.length||Object.keys(shop.have).length?"":"disabled"}>Vider</button>
        </div>
      </section>
      ${selected.length?`<section class="block">
        <h3>Recettes sélectionnées <small class="muted">· ${selected.length}</small></h3>
        <ul class="pick">${selected.map(r=>{
          const base=Number(r.servings)||0;
          return `<li data-id="${r.id}">
            <a class="pt" href="#/r/${r.id}">${esc(r.title)}</a>
            <span class="step"><button type="button" data-d="-1" aria-label="Moins">–</button><b>${esc(shop.sel[r.id])}</b><button type="button" data-d="1" aria-label="Plus">+</button><small>${base?"pers.":"×"}</small></span>
            <button type="button" class="x" data-rm aria-label="Retirer la recette">✕</button>
          </li>`}).join("")}</ul>
      </section>`:""}
      <div id="cat"></div>`;
    drawCat();
    window.scrollTo(0,y);

    const text=()=>items.map(i=>i.qty?`${i.name} (${i.qty})`:i.name).join("\n");
    cw.querySelectorAll("ul.pick li").forEach(li=>{
      const id=li.dataset.id;
      li.querySelectorAll(".step button").forEach(b=>b.onclick=()=>{
        shop.sel[id]=Math.max(1,(Number(shop.sel[id])||1)+Number(b.dataset.d));
        saveShop();draw();
      });
      li.querySelector("[data-rm]").onclick=()=>{removeRecipeFromCart(shop,id);saveShop();updateBadge();draw()};
    });
    $("#copy").onclick=async()=>{toast(await copyText(text())?"Liste copiée ✓":"Copie impossible")};
    const sh=$("#share");
    if(sh)sh.onclick=()=>navigator.share({title:"Liste de courses",text:text()}).catch(()=>{});
    $("#clear").onclick=()=>{
      if(!confirm("Vider la liste de courses ? Ton historique d’achats est conservé."))return;
      shop=normalizeShop({freq:shop.freq,basics:shop.basics});
      saveShop();updateBadge();draw();
    };
  };

  // --- appui long sur une tuile : options ---
  let lpTimer=null,lpFired=false;
  const dlg=$("#tiledlg");
  const openMenu=t=>{
    const key=t.dataset.k,name=t.dataset.n,isBuy=t.classList.contains("buy");
    $("#tdt").textContent=shownEmoji(name)+" "+name;
    const skip=$("#tdskip"),bas=$("#tdbasic");
    skip.hidden=!isBuy;
    skip.onclick=()=>{
      const it=cur.items.find(i=>i.key===key);
      if(it){const snap=JSON.stringify(shop);buyItem(shop,it,false);saveShop();dlg.close();draw();toastUndo("Retiré : "+name,()=>restore(snap))}
    };
    bas.textContent=isBasic(shop,key)?"Ne plus le considérer comme produit de base":"Le considérer comme produit de base (ex. sel, huile)";
    bas.onclick=()=>{toggleBasic(shop,key);saveShop();dlg.close();draw()};
    $("#tdclose").onclick=()=>dlg.close();
    dlg.showModal();
  };
  const stop=()=>clearTimeout(lpTimer);
  cw.addEventListener("pointerdown",e=>{
    lpFired=false;stop();
    const t=e.target.closest(".tile[data-k]");if(!t)return;
    lpTimer=setTimeout(()=>{lpFired=true;openMenu(t)},520);
  });
  ["pointerup","pointercancel","pointerleave"].forEach(ev=>cw.addEventListener(ev,stop));
  cw.addEventListener("contextmenu",e=>{if(e.target.closest(".tile"))e.preventDefault()});

  cw.addEventListener("click",e=>{
    const t=e.target.closest(".tile");if(!t)return;
    if(lpFired){lpFired=false;return}
    const snap=JSON.stringify(shop);
    if(t.classList.contains("buy")){
      const it=cur.items.find(i=>i.key===t.dataset.k);if(!it)return;
      buyItem(shop,it,true);saveShop();draw();
      toastUndo("Acheté : "+it.name,()=>restore(snap));
      return;
    }
    const name=t.dataset.add||t.dataset.n;
    addToList(shop,name,cur.derived);saveShop();
    if(t.dataset.add)sq.value="";
    draw();
    toastUndo("Ajouté : "+name,()=>restore(snap));
  });

  // --- barre « Il me faut… » ---
  sq.addEventListener("input",drawCat);
  $("#sf").onsubmit=e=>{
    e.preventDefault();
    const t=sq.value.trim();if(!t)return;
    const key=nameKey(t);
    if(cur.keys.has(key)){toast("Déjà dans la liste");sq.value="";drawCat();return}
    const hit=buildCatalog(rs,shop,new Set(),t).results.find(x=>x.key===key);
    const snap=JSON.stringify(shop);
    const name=hit?hit.name:capFirst(t);
    addToList(shop,name,cur.derived);saveShop();sq.value="";draw();
    toastUndo("Ajouté : "+name,()=>restore(snap));
  };
  draw();
}

/* ---------- photos : rester sous la limite de 1 Mo par recette ---------- */
const MAX_PHOTOS=6;
function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src})}
async function reencode(src,max,q){
  const img=await loadImg(src);
  const k=Math.min(1,max/Math.max(img.width,img.height));
  const c=document.createElement("canvas");
  c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
  c.getContext("2d").drawImage(img,0,0,c.width,c.height);
  return c.toDataURL("image/jpeg",q);
}
async function fitPhotos(photos,budget=800000){
  let ph=[...(photos||[])];
  const size=()=>ph.reduce((a,p)=>a+p.length,0);
  let max=1024,q=.72;
  try{
    while(size()>budget&&max>=400){
      max=Math.round(max*.8);q=Math.max(.5,q-.04);
      ph=await Promise.all(ph.map(p=>reencode(p,max,q)));
    }
  }catch(e){}
  return ph;
}

/* ---------- synchronisation ---------- */
let syncState={state:"off"},syncApi=null,refreshT=null;
function refreshView(){
  clearTimeout(refreshT);
  refreshT=setTimeout(()=>{
    const h=location.hash||"#/";
    if(/^#\/(new|edit)/.test(h))return;
    const a=document.activeElement;
    if(a&&["INPUT","TEXTAREA","SELECT"].includes(a.tagName))return;
    if(document.querySelector(".lightbox"))return;
    const y=window.scrollY;
    route().then(()=>window.scrollTo(0,y));
  },200);
}
function setStatus(st){syncState=st;renderSync()}
function renderSync(){
  const s=syncState,em=s.email?" · "+s.email:"";
  const tones={
    off:["","Synchronisation non configurée : les recettes restent sur cet appareil."],
    unavailable:["red","Service de synchronisation injoignable (réseau ?). L’app reste utilisable en local."],
    signedout:["red","Connecte-toi avec le compte partagé pour synchroniser vos recettes et votre panier."],
    syncing:["orange","Connexion en cours…"+em],
    ok:["green","Synchronisé"+em],
    pending:["orange","Envoi des modifications…"+em],
    offline:["orange","Hors ligne : les modifications seront envoyées au retour du réseau."+em],
    error:["red","Problème : "+(s.message||"inconnu")+em]
  };
  const [tone,text]=tones[s.state]||tones.off;
  const dot=$("#dot"),msg=$("#syncmsg");
  dot.className="dot "+tone;dot.hidden=!tone;
  msg.textContent=text;
  $("#authf").hidden=s.state!=="signedout";
  $("#signout").hidden=!["syncing","ok","pending","offline","error"].includes(s.state);
}
function authMsg(code=""){
  if(/invalid-credential|wrong-password|user-not-found|invalid-login/.test(code))return"E-mail ou mot de passe incorrect.";
  if(code.includes("weak-password"))return"Mot de passe trop court (6 caractères minimum).";
  if(code.includes("invalid-email"))return"Adresse e-mail invalide.";
  if(code.includes("admin-restricted")||code.includes("operation-not-allowed"))return"Les inscriptions sont fermées : utilise le compte existant.";
  if(code.includes("network"))return"Pas de réseau, réessaie plus tard.";
  if(code.includes("too-many-requests"))return"Trop d’essais, patiente quelques minutes.";
  return"Connexion impossible ("+(code||"erreur")+").";
}
async function doAuth(kind){
  if(!syncApi)return;
  $("#autherr").textContent="";
  try{
    await syncApi[kind]($("#aemail").value.trim(),$("#apass").value);
    $("#apass").value="";toast("Connecté ✓");
  }catch(err){$("#autherr").textContent=authMsg(err&&err.code)}
}
$("#authf").onsubmit=e=>{e.preventDefault();doAuth("signIn")};
$("#signout").onclick=async()=>{
